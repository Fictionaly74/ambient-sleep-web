<!doctype html>
<html lang="ja">

<meta name="description" content="An ambient pinball garden: three arrivals awaken the reels, a 120-ball jackpot, meditative sound and luminous constellations.">
<title>Ambient Pinball v0.9.6 — a quiet little universe</title>
<style>
:root{color-scheme:dark;--bg:#080f22;--line:rgba(175,209,229,.19);--ink:#e5ecf0;--sub:#91a9ba;--gold:#e2d1ae;--teal:#a5dcd6;--lilac:#c4b5e5}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#070e1b;color:var(--ink);font-family:Inter,"Noto Sans JP",system-ui,-apple-system,sans-serif}
body:before{content:"";position:fixed;inset:-24%;pointer-events:none;background:radial-gradient(ellipse at 21% 25%,#496b9560,transparent 37%),radial-gradient(ellipse at 77% 72%,#5a468359,transparent 39%),radial-gradient(ellipse at 54% 50%,#1c53606e,transparent 47%);filter:blur(65px);animation:ambientDrift 28s ease-in-out infinite alternate}
@keyframes ambientDrift{from{transform:scale(1) translate(-1%,0);opacity:.72}to{transform:scale(1.1) translate(2%,-2%);opacity:1}}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible{outline:2px solid #a5e5d9;outline-offset:4px}
#app{position:relative;isolation:isolate;width:min(100vw,540px);height:100dvh;margin:0 auto;display:grid;grid-template-rows:54px minmax(0,1fr);overflow:hidden;background:linear-gradient(160deg,#132238db 0%,#0d1b2fdc 42%,#172a3ad8 100%);border-inline:1px solid #a0bcdc1e;box-shadow:0 22px 100px #01040d9c,0 0 100px #728f9b15}
#app:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:20;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 150 150' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.69' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath filter='url(%23n)' opacity='.027' d='M0 0h150v150H0z'/%3E%3C/svg%3E");opacity:.28}
header{z-index:3;display:flex;justify-content:space-between;align-items:center;padding:7px 14px 6px;gap:5px;background:linear-gradient(180deg,#111c31a6,transparent)}
.brand small{display:block;color:#dbcda9;letter-spacing:.31em;font-size:8px;text-transform:uppercase;margin-bottom:8px;text-shadow:0 0 19px #f1d8a265}
.brand strong{display:block;font-weight:350;letter-spacing:.22em;font-size:15px;white-space:nowrap;text-shadow:0 0 20px #a7e1eb26}
.actions{display:flex;gap:7px;align-items:center}
.icon-btn{width:37px;height:37px;border:1px solid #b6cdd53e;background:linear-gradient(145deg,#b6e0e914,#8499c009);border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 1px #e4edfc0a,0 0 20px #7ebace09;backdrop-filter:blur(8px);transition:background .3s,border-color .3s,box-shadow .3s}
.icon-btn:hover{background:#a5cbdf20;border-color:#bde9e19a;box-shadow:0 0 20px #a7d6cf30}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:#d4e3e6;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
.icon-btn[aria-pressed="true"]{border-color:#b7e9d39b;background:#5a9f9970;box-shadow:0 0 20px #a4e1d83b}
#board-shell{position:relative;min-height:0;margin:0 2px 0;overflow:hidden;border:1px solid #b5d9e03d;border-radius:220px 220px 14px 14px / 52px 52px 14px 14px;background:#0c192c;box-shadow:inset 0 0 60px #050b1c66,0 0 30px #92bdda13,0 0 1px #e2e8f566}
#board-shell:before{content:"";position:absolute;inset:6px;z-index:1;pointer-events:none;border:1px solid #c7dfed24;border-radius:220px 220px 12px 12px / 48px 48px 12px 12px;box-shadow:inset 0 1px 25px #c6e3ed0d,0 0 26px #99cad717}
#board-shell:after{content:"";position:absolute;z-index:1;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(121deg,#cee9f408,transparent 29%,transparent 77%,#cfc3ff08);box-shadow:inset 0 0 90px #00000033}
canvas{display:block;width:100%;height:100%;touch-action:none}
#event{position:absolute;z-index:5;top:49%;left:0;right:0;text-align:center;pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity 1.15s ease,transform 1.15s ease}
#event.show{opacity:1;transform:translateY(0)}
#event .big{font-family:Georgia,serif;letter-spacing:.24em;font-size:clamp(24px,6vw,39px);font-weight:normal;color:#f5e7c9;text-shadow:0 0 15px #e8d7cbaf,0 0 54px #d2c1e6ba;white-space:nowrap}
#event.alignment .big{color:var(--event-tone,#f4ebfb);text-shadow:0 0 20px var(--event-glow,#d2d7fdc2),0 0 65px #9ed9e66b}
#event.jackpot .big{color:#ffebc9;font-size:clamp(29px,7vw,47px);text-shadow:0 0 20px #ffe6bade,0 0 62px #c7d9ffcc,0 0 110px #d4bbefab}
#event .small{font-size:9px;letter-spacing:.24em;color:#d3e3e2;margin-top:10px;text-shadow:0 0 18px #9fe0ef7d}
#slot{z-index:3;position:absolute;pointer-events:none;left:0;top:0;width:140px;height:53px;border:1px solid #d0e3eb74;border-radius:13px;background:radial-gradient(ellipse at 50% 0,#759cbb59,transparent 83%),linear-gradient(145deg,#32465dce,#17293ecd 72%,#36475bcc);box-shadow:inset 0 1px 0 #f5f4fa43,inset 0 0 14px #b9e5f72b,0 0 26px #aacdda23;text-align:center;display:flex;align-items:center;justify-content:center;min-height:0;--board-scale:1}
#slot:before{content:"";position:absolute;inset:3px;border:1px solid #e2eef431;border-radius:10px;pointer-events:none}
.reels{width:100%;display:flex;justify-content:center;gap:calc(9px * var(--board-scale))}
.reel{width:calc(42px * var(--board-scale));height:calc(42px * var(--board-scale));min-width:0;min-height:0;border-radius:50%;border:1px solid #cee6e58c;background:radial-gradient(circle at 32% 22%,#dfe6fb24,transparent 29%),radial-gradient(circle at 50% 65%,#647c9c56,#25354c8c 82%);display:grid;place-items:center;box-shadow:inset 0 0 13px #cde4f423,0 0 16px #a6cde64c;position:relative;overflow:hidden}
.reel:after{content:"";position:absolute;inset:4px;border:1px solid #eff0fa38;border-radius:50%;pointer-events:none}
.reel span{display:block;font-family:Georgia,"Times New Roman",serif;font-size:calc(28px * var(--board-scale));line-height:1;color:#f2e4cb;text-shadow:0 0 12px #fee7c5b8,0 0 25px #ced9f488;transition:color .45s;user-select:none}
.reel.spin span{filter:blur(1.3px);opacity:.65;animation:pulse .29s ease-in-out infinite alternate}
.reel.match{border-color:var(--theme-rim,#f4dca9);box-shadow:inset 0 0 22px #f3dfa42b,0 0 20px var(--theme-halo,#f5e5a56a),0 0 48px #b2dbd923}
.reel.match span{color:#fff3d8}
@keyframes pulse{to{transform:translateY(4px);opacity:.4}}
/* The bonus frame drains symmetrically from twelve o'clock toward six.
   Both illuminated side paths are drawn from bottom centre upward; reducing
   their visible length therefore makes the dark fronts descend together. */
.reels{position:relative;z-index:1}
#slot.bonus-active{border-color:var(--theme-rim,#b8e5df)}
#slot-bonus-rim{position:absolute;inset:0;width:100%;height:100%;overflow:visible;opacity:0;transition:opacity .36s ease;z-index:2;pointer-events:none}
#slot.bonus-active #slot-bonus-rim{opacity:1}
#slot-bonus-rim path{fill:none;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
#slot-bonus-track{stroke:#b4ccde;stroke-opacity:.20;stroke-width:1.9}
.slot-bonus-halo{stroke:var(--theme-rim,#94dbdf);stroke-opacity:.38;stroke-width:7;filter:blur(3px);stroke-dasharray:100;stroke-dashoffset:0}
.slot-bonus-progress{stroke:url(#bonus-rim-gradient);stroke-width:2.8;stroke-dasharray:100;stroke-dashoffset:0;filter:drop-shadow(0 0 3px var(--theme-rim,#b5eff3))}
#slot-status{height:14px;font-size:9px;letter-spacing:.1em;color:#a4b9b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* The cadence is a labelled two-state control, not an ambiguous falling-ball icon. */
.brand{min-width:0}.actions{flex-shrink:0}
.flow-btn{display:flex;align-items:center;gap:7px;height:39px;min-width:100px;padding:5px 10px;border:1px solid #bdd6de65;border-radius:21px;background:linear-gradient(130deg,#669ba13b,#6980a126);text-align:left;box-shadow:inset 0 1px #ebf8ed16;transition:background .3s,border-color .3s}
.flow-btn svg{width:16px;height:16px;flex:none;fill:none;stroke:#c9dfe5;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.flow-copy{display:flex;flex-direction:column;gap:1px;line-height:1.13}.flow-mode{font-size:10px;font-weight:650;letter-spacing:.10em}.flow-detail{font-size:9px;color:#d6e5e7;white-space:nowrap;font-variant-numeric:tabular-nums}
.flow-btn[aria-pressed="true"]{background:linear-gradient(120deg,#60bab360,#8385b442);border-color:#a5eee4bb;box-shadow:0 0 17px #83ceba4f}
@media(max-width:380px){header{padding-inline:8px}.brand strong{font-size:11px;letter-spacing:.10em}.brand small{font-size:6.8px;letter-spacing:.13em}.icon-btn{width:32px;height:32px}.actions{gap:4px}.flow-btn{min-width:83px;height:35px;padding:4px 7px;gap:4px}.flow-btn svg{width:13px;height:13px}.flow-mode{font-size:9px}.flow-detail{font-size:8px}#board-shell{margin-inline:0}#slot{margin-inline:0}}
@media(max-height:690px){#app{grid-template-rows:47px minmax(0,1fr)}header{padding-top:4px}.brand small{margin-bottom:3px}}
@media(min-width:780px){#app{border-radius:13px}}
@media(prefers-reduced-motion:reduce){body:before{animation:none}#event{transition:none}.reel.spin span{animation:none}.icon-btn{transition:none}}
</style>

<style>
@media (display-mode: standalone) {
  #app { grid-template-rows: calc(54px + env(safe-area-inset-top, 0px)) minmax(0, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
  header { padding-top: calc(7px + env(safe-area-inset-top, 0px)); }
}
@media (display-mode: standalone) and (max-height: 690px) {
  #app { grid-template-rows: calc(47px + env(safe-area-inset-top, 0px)) minmax(0, 1fr); }
  header { padding-top: calc(4px + env(safe-area-inset-top, 0px)); }
}
</style>
</head>
<body>
<main id="app" aria-label="Ambient Pinball">
  <header>
    <div class="brand"><small>a quiet little universe</small><strong>AMBIENT PINBALL</strong></div>
    <div class="actions">
      <button id="flow" class="flow-btn" type="button" aria-label="現在CALM、中央1球を3秒ごとに排出。押すとFLOW" aria-pressed="false" title="押すとFLOW（中央1球 / 1.65秒）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><path d="M12 9v11m-5-5 5 5 5-5"/></svg>
        <span class="flow-copy" aria-hidden="true"><span class="flow-mode" id="flow-mode">CALM</span><span class="flow-detail" id="flow-detail">1球 / 3秒</span></span>
      </button>
      <button id="sound" class="icon-btn" type="button" aria-label="音をオンにする" aria-pressed="false" title="音をオン／オフ">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="sound-mark" d="m17 9 4 6m0-6-4 6"/></svg>
      </button>
      <button id="pause" class="icon-btn" type="button" aria-label="一時停止" aria-pressed="false" title="一時停止／再開">
        <svg viewBox="0 0 24 24"><path id="pause-mark" d="M8 5v14M16 5v14"/></svg>
      </button>
    </div>
  </header>
  <section id="board-shell" aria-label="5つの投入口と左右対称のバンパー・回転風車があるボール盤面">
    <canvas id="board"></canvas>
    <div id="event" aria-live="polite"><div class="big" id="event-title">REACH</div><div class="small" id="event-detail">a quiet coincidence</div></div>
    <div id="slot" aria-label="START口へ3球入るごとに起動するスロット">
    <div class="reels" aria-live="off">
      <div class="reel"><span>✧</span></div><div class="reel"><span>◇</span></div><div class="reel"><span>☾</span></div>
    </div>
    <svg id="slot-bonus-rim" aria-hidden="true" focusable="false" preserveAspectRatio="none">
      <defs><linearGradient id="bonus-rim-gradient" x1="0%" y1="0%" x2="0%" y2="100%"><stop id="rim-stop-top" offset="0%" stop-color="#b3eff0"/><stop id="rim-stop-mid" offset="55%" stop-color="#f3dfba"/><stop id="rim-stop-bottom" offset="100%" stop-color="#c6b9f3"/></linearGradient></defs>
      <path id="slot-bonus-track" pathLength="100"/>
      <path id="slot-bonus-halo-left" class="slot-bonus-halo" pathLength="100"/>
      <path id="slot-bonus-halo-right" class="slot-bonus-halo" pathLength="100"/>
      <path id="slot-bonus-progress-left" class="slot-bonus-progress" pathLength="100"/>
      <path id="slot-bonus-progress-right" class="slot-bonus-progress" pathLength="100"/>
    </svg>
    <span id="bonus-announcement" class="sr-only" aria-live="polite"></span>
    <div id="slot-status" class="sr-only" aria-live="polite">START 0/3 · 3球ごとにスロットが回ります</div>
    </div>
  </section>

</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('board');const ctx=canvas.getContext('2d',{alpha:false});
const shell=document.getElementById('board-shell'), reels=[...document.querySelectorAll('.reel')];
const soundButton=document.getElementById('sound'),pauseButton=document.getElementById('pause');
const W=480,BASE_H=610,PI=Math.PI,TAU=2*PI;let H=BASE_H;
let display={s:1,x:0,y:0,w:0,h:0};
let running=true,soundOn=false,flowFast=false,elapsed=0,dropTime=0.9,ringPulse=0;
let waveCount=0,lastWaveSize=0,bumperHits=0,bumperSounds=0,lowerRailContacts=0;
const bumperHitsByType={glass:0,wood:0,chime:0},bumperSoundsByType={glass:0,wood:0,chime:0};
let winGlow=0,reachGlow=0,slotQueue=0,slotActive=false,eventTimeout=0;
let slotBonusUntil=-1,slotBonusCount=0,slotBonusWasActive=false,lastSlotResult=null,jackpotWasActive=false;
let slotWinCount=0,slotLossCount=0;
let constellation=null,alignmentCount=0,alignmentSoundCount=0,meditationNext=10,meditationPhraseCount=0,debugNextSlot=null;
let winningTheme=null,lastWinningTheme=null,themeNextPhrase=-1,themePhraseCount=0;
const SLOT_ENTRY_TARGET=3,SLOT_WIN_PROBABILITY=.50,SLOT_BONUS_DURATION=10,CHARGE_TARGET=120,JACKPOT_DURATION=5;
let slotProgress=0,slotTriggerCount=0,slotSpinCount=0;
let chargeBalls=0,jackpotUntil=-1,jackpotCount=0,drainedBalls=0,startedSlots=0,millImpacts=0;
const slotUI=document.getElementById('slot');
const rimSVG=document.getElementById('slot-bonus-rim');
const rimTrack=document.getElementById('slot-bonus-track');
const rimHalos=[document.getElementById('slot-bonus-halo-left'),document.getElementById('slot-bonus-halo-right')];
const rimProgress=[document.getElementById('slot-bonus-progress-left'),document.getElementById('slot-bonus-progress-right')];
const rimActivePaths=[...rimHalos,...rimProgress];
let rimRemainingFraction=0;
function layoutBonusRim(){
  const width=Math.max(1,slotUI.offsetWidth),height=Math.max(1,slotUI.offsetHeight);
  const e=2.5,r=Math.min(11,height*.26,width*.10),right=width-e,bottom=height-e;
  const centre=width/2;
  // Neutral full track (one continuous rounded rectangle).
  const track=`M ${centre} ${e} H ${right-r} Q ${right} ${e} ${right} ${e+r} V ${bottom-r} Q ${right} ${bottom} ${right-r} ${bottom} H ${e+r} Q ${e} ${bottom} ${e} ${bottom-r} V ${e+r} Q ${e} ${e} ${e+r} ${e} Z`;
  // Two exactly mirrored half-perimeters: bottom centre (6) -> top centre (12).
  // Rendering only the first remaining fraction keeps the glow at the bottom,
  // creating synchronized extinction fronts from the top down on both sides.
  const leftSide=`M ${centre} ${bottom} H ${e+r} Q ${e} ${bottom} ${e} ${bottom-r} V ${e+r} Q ${e} ${e} ${e+r} ${e} H ${centre}`;
  const rightSide=`M ${centre} ${bottom} H ${right-r} Q ${right} ${bottom} ${right} ${bottom-r} V ${e+r} Q ${right} ${e} ${right-r} ${e} H ${centre}`;
  rimSVG.setAttribute('viewBox',`0 0 ${width} ${height}`);
  rimTrack.setAttribute('d',track);
  for(const line of [rimHalos[0],rimProgress[0]])line.setAttribute('d',leftSide);
  for(const line of [rimHalos[1],rimProgress[1]])line.setAttribute('d',rightSide);
}
function syncBonusRim(){
  rimRemainingFraction=Math.max(0,Math.min(1,(slotBonusUntil-elapsed)/SLOT_BONUS_DURATION));
  slotUI.classList.toggle('bonus-active',rimRemainingFraction>0);
  // Each side uses its own pathLength=100; both shorten at the same rate.
  // A full rim starts lit; at halfway only the lower half remains lit.
  const offset=(100*(1-rimRemainingFraction)).toFixed(3);
  for(const line of rimActivePaths)line.style.strokeDashoffset=offset;
}

let seed=49021;
function rnd(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}
function lerp(a,b,t){return a+(b-a)*t}
function clamp(x,a,b){return Math.min(b,Math.max(a,x))}
// Restored from v0.8: required by bounceSegment() when a rail collision triggers a soft note.
function noteAt(y){return [261.63,293.66,329.63,392,440,523.25][clamp(Math.floor(y/105),0,5)]}
const feeders=[68,154,240,326,412],balls=[],ripples=[],dust=[];
for(let i=0;i<100;i++)dust.push({x:rnd()*W,ny:rnd(),y:rnd()*H,r:rnd()*.9+.18,a:rnd()*.31+.03,p:rnd()*TAU});
// 10 original bumper positions, now ~2x their v0.6 radii, plus three new symmetric pairs.
// Their y positions scale with the *actual* full-height playfield, not a letterboxed 610px image.
const bumpers=[
 {x:118,fy:.15,r:21.76,type:'glass',pitch:392},{x:362,fy:.15,r:21.76,type:'glass',pitch:392},
 {x:240,fy:.26,r:20.48,type:'chime',pitch:329.63},
 {x:72,fy:.34,r:15.36,type:'wood',pitch:261.63},{x:408,fy:.34,r:15.36,type:'wood',pitch:261.63},
 {x:174,fy:.405,r:24.32,type:'glass',pitch:440},{x:306,fy:.405,r:24.32,type:'glass',pitch:440},
 {x:106,fy:.54,r:24.32,type:'wood',pitch:293.66},{x:374,fy:.54,r:24.32,type:'wood',pitch:293.66},
 {x:240,fy:.47,r:24.58,type:'chime',pitch:392},
 {x:70,fy:.25,r:18.4,type:'chime',pitch:523.25},{x:410,fy:.25,r:18.4,type:'chime',pitch:523.25},
 {x:65,fy:.455,r:18.5,type:'wood',pitch:349.23},{x:415,fy:.455,r:18.5,type:'wood',pitch:349.23},
 {x:60,fy:.60,r:18.5,type:'glass',pitch:587.33},{x:420,fy:.60,r:18.5,type:'glass',pitch:587.33}
];
// The hand-defined mirrored connections form a restrained, slowly revealed star map.
// Only artwork references these indices; game physics and collision are unchanged.
const starLinks=[[2,0],[2,1],[0,10],[1,11],[10,3],[11,4],[3,5],[4,6],
                 [5,9],[6,9],[5,7],[6,8],[7,12],[8,13],[12,14],[13,15]];
const ramps=[],mills=[
 {x:157,y:345,r:19,angle:.10,omega:0,inertia:720,drag:1.35},
 {x:323,y:345,r:19,angle:-.10,omega:0,inertia:720,drag:1.35}
];
const START={x1:224,x2:256,y:0};
const slotBody={left:154,right:326,top:0,bottom:0};
const slotWalls=[],funnel=[];
const layout={feederY:19,drainY:BASE_H-22,railEndY:BASE_H-52,sideRailStartY:50};
function layoutGeometry(){
  for(const p of bumpers)p.y=H*p.fy;
  for(const m of mills)m.y=H*.57;
  slotBody.top=Math.round(H*.685);slotBody.bottom=slotBody.top+74;
  START.y=slotBody.top-15;
  layout.feederY=18;layout.drainY=H-19;layout.railEndY=H-52;
  const railStart=slotBody.bottom+12,railEnd=layout.railEndY;
  ramps.length=0;ramps.push(
    {ax:31,ay:railStart,bx:196,by:railEnd},
    {ax:449,ay:railStart,bx:284,by:railEnd},
    {ax:196,ay:railEnd,bx:211,by:railEnd+8},
    {ax:284,ay:railEnd,bx:269,by:railEnd+8}
  );
  slotWalls.length=0;slotWalls.push(
    {ax:slotBody.left,ay:slotBody.top,bx:START.x1-4,by:slotBody.top,width:1.6},
    {ax:START.x2+4,ay:slotBody.top,bx:slotBody.right,by:slotBody.top,width:1.6},
    {ax:slotBody.left,ay:slotBody.top,bx:slotBody.left,by:slotBody.bottom,width:2.3},
    {ax:slotBody.right,ay:slotBody.top,bx:slotBody.right,by:slotBody.bottom,width:2.3},
    {ax:slotBody.left,ay:slotBody.bottom,bx:slotBody.right,by:slotBody.bottom,width:2.3}
  );
  funnel.length=0;funnel.push(
    {ax:184,ay:START.y-30,bx:START.x1-3,by:START.y-3,width:1.4},
    {ax:296,ay:START.y-30,bx:START.x2+3,by:START.y-3,width:1.4}
  );
