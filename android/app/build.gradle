plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fictionaly74.ambientsleep'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fictionaly74.ambientsleep'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
}

tasks.register('syncWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html'
        include 'styles.css'
        include 'app.js'
        include 'audio/**'
    }
    into(layout.projectDirectory.dir('src/main/assets/www'))
}

preBuild.dependsOn syncWebAssets

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
